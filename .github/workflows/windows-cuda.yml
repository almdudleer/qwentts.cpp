name: windows-cuda
# Windows x64 CUDA 12.4 build of tts-server / qwen-tts (for the "General" game launcher).
on:
  workflow_dispatch:
  push:
    tags: ['win-*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
        with: { submodules: recursive }
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Build
        shell: cmd
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="75-virtual;86-real;89-real"
          cmake --build build --config Release -j 4
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Get-ChildItem build -Recurse -Include *.exe,*.dll | Copy-Item -Destination pkg
          Get-ChildItem pkg | Format-Table Name, Length
          Compress-Archive -Path pkg\* -DestinationPath qwentts-win-cuda12.4-x64.zip
      - uses: actions/upload-artifact@v7.0.2
        with: { name: qwentts-win-cuda12.4-x64, path: qwentts-win-cuda12.4-x64.zip }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.4
        with: { files: qwentts-win-cuda12.4-x64.zip }
